# Snapshot of pvc-nfs-dynamic (example-pvc.yaml) and a volume restored from it. A snapshot is a
# tar archive that the driver writes on the NFS server next to the volume; it is not a
# point-in-time copy, so quiesce writers first if you need a consistent one.
#
# The snapshot class uses the same driver as every other volume; which backend takes the snapshot
# is decided by the source volume, not by the class. The class takes no parameters.
#
# Restore (and clone) only with an NFS StorageClass such as nfs-csi: a guest NFS snapshot lives in
# this guest cluster only, so a PVC on a Supervisor-backed StorageClass that uses it as its
# dataSource is rejected with InvalidArgument.
#
# Guest NFS snapshots do not need the Supervisor's block volume snapshot support. When that is off,
# the pvCSI admission webhook still accepts this class while "guest-nfs-volume" is enabled, and
# accepts VolumeSnapshots and VolumeSnapshotContents of guest NFS volumes only. The webhook reads
# both feature states when it starts.
#
# The snapshot's restore size is the size of its archive, which is about the amount of data in the
# volume, and the restored PVC must request at least that much. An NFS volume can hold more data
# than its PVC requests, so a nearly full or overfilled source may need a larger restored PVC.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: nfs-snapshot-class
driver: csi.vsphere.vmware.com
deletionPolicy: Delete
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: nfs-snapshot
  namespace: default
spec:
  volumeSnapshotClassName: nfs-snapshot-class
  source:
    persistentVolumeClaimName: pvc-nfs-dynamic
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-nfs-restored
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-csi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: nfs-snapshot
